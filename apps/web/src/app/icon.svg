        fill="url(#leaf)"/>
  <!-- sağ yaprak -->
  <path d="M16 16.6 C 18.7 12.9 22.7 10.9 25.8 11.5 C 25.3 15.1 21.2 17.7 16 16.6 Z"
        fill="url(#leaf)"/>

  <!-- yaprak damarları (ince, hafif) -->
